# GitHub Actions adapter for per-PR preview deploys — copy to .github/workflows/ and adjust.
# Portable by design: this workflow calls the PREVIEW_CMD / TEARDOWN_CMD from .claude/context.md
# (Preview deploy section) — it names no vendor. Set them as repo variables (or inline them).
#   - on PR opened/updated → run the deploy command, capture its printed URL, comment it on the PR
#   - on PR closed        → run the teardown command to destroy the ephemeral env
# Merge and visual-bless stay human; this only stands the environment up and posts the link.
name: preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One preview per PR; a new push supersedes the previous deploy rather than stacking.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Deploy preview
        id: deploy
        env:
          # [CONFIGURE] .claude/context.md → Preview deploy → "Preview command".
          # Must print the preview URL as the LAST line of stdout. Empty → preview disabled (skip).
          PREVIEW_CMD: ${{ vars.PREVIEW_CMD }}
        run: |
          if [ -z "${PREVIEW_CMD}" ]; then
            echo "No PREVIEW_CMD configured — skipping preview (link will be None)."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL="$(bash -lc "${PREVIEW_CMD}" | tail -n 1)"
          echo "Preview URL: ${URL}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on the PR
        if: ${{ steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            const marker = "<!-- preview-url -->";
            const body = `${marker}\n🔎 **Preview:** ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  teardown:
    if: ${{ github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tear down preview
        env:
          # [CONFIGURE] .claude/context.md → Preview deploy → "Teardown command". Empty → nothing to do.
          TEARDOWN_CMD: ${{ vars.TEARDOWN_CMD }}
        run: |
          if [ -z "${TEARDOWN_CMD}" ]; then
            echo "No TEARDOWN_CMD configured — nothing to tear down."
            exit 0
          fi
          bash -lc "${TEARDOWN_CMD}"
