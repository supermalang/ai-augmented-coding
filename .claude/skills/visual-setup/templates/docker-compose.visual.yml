# docker-compose.visual.yml — the pinned environment for visual baseline capture.
#
# ⚠️  Baselines are ONLY valid when captured in THIS image. Local runs and CI MUST
#     use the identical tag, or screenshots differ on fonts/anti-aliasing and every
#     baseline re-fails. Pin the tag to your installed Playwright version:
#         npx playwright --version   →   use the matching mcr.microsoft.com/playwright tag
#
# Worker sizing (see playwright.visual.config): NEVER auto-detect workers inside a
# container — os.cpus() reports the HOST's cores, not this container's limit, so
# autodetect over-subscribes and thrashes. Size PW_WORKERS to `cpus` below.
# Rule of thumb: ~1 vCPU + ~1.5 GB RAM per worker  →  2 workers ≈ 2 CPUs / 3 GB.

services:
  visual:
    image: mcr.microsoft.com/playwright:{{PLAYWRIGHT_TAG}}   # e.g. v1.48.0-noble — PIN, do not use :latest
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      CI: "1"
      PW_WORKERS: "{{PW_WORKERS}}"          # keep in lockstep with `cpus` below
      VISUAL_BASE_URL: "{{BASE_URL}}"
    deploy:
      resources:
        limits:
          cpus: "{{CPUS}}"                  # allotted vCPU — PW_WORKERS is sized to this
          memory: {{MEMORY}}                # ~1.5 GB × workers (e.g. 3g for 2 workers)
    # Split a large suite across CI runners with:  --shard=<i>/<n>
    command: npx playwright test -c {{VISUAL_CONFIG}}
